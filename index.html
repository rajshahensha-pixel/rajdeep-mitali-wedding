<!doctype html>
<html lang="en">
<head>

<title>Rajdeep & Mitali | Wedding Reception</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap');
*{box-sizing:border-box}body{margin:0;background:#f6efe4;color:#3b2025;font-family:Montserrat,sans-serif}
main{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(720px,100%);min-height:90svh;background:#fffaf3;border:1px solid #c8a66a;box-shadow:0 20px 70px #3b20251f;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:48px 24px}
.card:before{content:"";position:absolute;inset:14px;border:1px solid #c8a66a55;pointer-events:none}
.eyebrow{letter-spacing:.28em;text-transform:uppercase;font-size:11px;color:#8d6a39}.names{font-family:"Cormorant Garamond",serif;font-size:clamp(58px,14vw,110px);line-height:.8;margin:30px 0 24px;color:#5b1d2a;font-weight:600}.amp{font-style:italic;color:#b08a4b}.date{font-size:14px;letter-spacing:.2em}.venue{margin:26px 0 8px;font-family:"Cormorant Garamond",serif;font-size:28px}.address{font-size:11px;line-height:1.7;color:#735d5d}.btn{display:inline-block;margin-top:28px;padding:14px 24px;border:1px solid #8d6a39;color:#5b1d2a;text-decoration:none;font-size:11px;letter-spacing:.16em;text-transform:uppercase}.details{margin-top:30px;font-size:12px;line-height:1.8}.orn{color:#b08a4b;font-size:22px;margin:14px 0}
</style>
</head>
<body><main><section class="card"><div>
<div class="eyebrow">You are cordially invited</div>
<div class="orn">✦</div>
<div class="names">Rajdeep <span class="amp">&amp;</span><br>Mitali</div>
<div class="date">28 · 11 · 2026</div>
<div class="venue">Wedding Reception</div>
<div class="details"><strong>6 PM – 10 PM</strong></div>
<div class="venue" style="font-size:22px">Golden Crown Lawn</div>
<div class="address">Opposite Doordarshan Colony, VIP Road,<br>Borbari, Guwahati, Assam</div>
<a class="btn" href="https://www.google.com/maps/place/CROWN-Wedding+Hall+%26+Lawn+Guwahati/@26.1486969,91.8119556,20.5z" target="_blank" rel="noopener">Open Location</a>
<div class="orn">❦</div>
<div class="eyebrow">With love, Rajdeep &amp; Mitali</div>
</div></section></main></body></html>
